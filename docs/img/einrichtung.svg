<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="980" height="350" role="img" aria-label="Einrichtung in vier Schritten: App Registration in Entra ID, Skript auf der Probe ablegen, manuell testen, Sensor in PRTG anlegen. Die drei Werte AppId, TenantId und ClientSecret aus Schritt 1 werden in Schritt 3 und 4 wieder gebraucht.">
  <title>Einrichtung in vier Schritten</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
    <marker id="bo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <rect width="980" height="350" fill="#f6f8fa"/>

  <!-- Karte 1 -->
  <rect x="24" y="52" width="210" height="182" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <circle cx="52" cy="80" r="15" fill="#0969da"/>
  <text x="52" y="85" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="78" y="85" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">App Registration</text>
  <text x="44" y="115" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e">Entra Admin Center</text>
  <text x="44" y="140" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• Neue App, Single tenant</text>
  <text x="44" y="160" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• 2 × Application permission</text>
  <text x="44" y="180" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• Client Secret erzeugen</text>
  <text x="44" y="205" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#bc4c00">• Admin Consent geben</text>
  <text x="44" y="223" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#bc4c00">ohne Consent: 403</text>

  <!-- Karte 2 -->
  <rect x="264" y="52" width="210" height="182" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <circle cx="292" cy="80" r="15" fill="#0969da"/>
  <text x="292" y="85" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="318" y="85" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Skript ablegen</text>
  <text x="284" y="115" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e">auf jeder Probe</text>
  <text x="284" y="140" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• Ordner Custom Sensors\</text>
  <text x="292" y="156" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">EXEXML\</text>
  <text x="284" y="181" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#bc4c00">• ExecutionPolicy setzen</text>
  <text x="284" y="199" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#bc4c00">in 64- UND 32-Bit</text>
  <text x="284" y="223" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• Unblock-File</text>

  <!-- Karte 3 -->
  <rect x="504" y="52" width="210" height="182" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <circle cx="532" cy="80" r="15" fill="#0969da"/>
  <text x="532" y="85" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="558" y="85" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Manuell testen</text>
  <text x="524" y="115" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e">direkt auf der Probe</text>
  <rect x="524" y="130" width="170" height="40" rx="5" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="534" y="146" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#1f2328">.\Intune-EntraID-PRTG.ps1</text>
  <text x="534" y="161" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#1f2328">-AppId … -TenantId …</text>
  <text x="524" y="192" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#1a7f37">• Eine Zeile &lt;prtg&gt; … ?</text>
  <text x="524" y="212" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e">Erst danach Sensor anlegen –</text>
  <text x="524" y="227" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e">spart Suche im PRTG-Log.</text>

  <!-- Karte 4 -->
  <rect x="744" y="52" width="210" height="182" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <circle cx="772" cy="80" r="15" fill="#1a7f37"/>
  <text x="772" y="85" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="798" y="85" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Sensor anlegen</text>
  <text x="764" y="115" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e">in PRTG</text>
  <text x="764" y="140" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• EXE/Script Advanced</text>
  <text x="764" y="160" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• Parameter eintragen</text>
  <text x="764" y="180" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• Timeout 120 s</text>
  <text x="764" y="200" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• Intervall ≥ 15 min</text>
  <text x="764" y="223" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328">• Mutex bei mehreren</text>

  <!-- Pfeile zwischen den Karten -->
  <path d="M236 143 H 260" stroke="#0969da" stroke-width="1.8" fill="none" marker-end="url(#b)"/>
  <path d="M476 143 H 500" stroke="#0969da" stroke-width="1.8" fill="none" marker-end="url(#b)"/>
  <path d="M716 143 H 740" stroke="#0969da" stroke-width="1.8" fill="none" marker-end="url(#b)"/>

  <!-- Carry-Band: die drei Werte aus Schritt 1 -->
  <path d="M129 236 V 286 H 849" stroke="#bc4c00" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>
  <path d="M609 286 V 238" stroke="#bc4c00" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#bo)"/>
  <path d="M849 286 V 238" stroke="#bc4c00" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#bo)"/>
  <rect x="250" y="274" width="300" height="24" rx="5" fill="#f6f8fa"/>
  <text x="400" y="291" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#bc4c00">AppId · TenantId · ClientSecret</text>
  <text x="400" y="322" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#59636e">In Schritt 1 notieren – das Secret ist danach nie wieder einsehbar.</text>
</svg>
